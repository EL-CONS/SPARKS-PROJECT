<!doctype html>
<!--
  Prueba minima: lectura de un recorte 64x64 directo desde S3 (nasa-irsa-spherex)
  con peticiones HTTP Range en el navegador, sin pasar por el servidor de recortes de IRSA.

  Uso:
    python3 -m http.server 8765
    Abrir http://127.0.0.1:8765/s3-range-test.html
    Pegar una URL S3 derivada de cloud_access de SIA (https://nasa-irsa-spherex.s3.amazonaws.com/<key>)
    y pulsar "Probar Range".
-->
<meta charset="utf-8">
<title>SPHEREx S3 Range Test</title>
<style>
  body { font-family: monospace; background: #06080C; color: #E6EDF3; padding: 16px; }
  input, button { font-family: monospace; padding: 6px 10px; }
  input { width: 680px; max-width: 100%; }
  pre { background: #11161F; padding: 12px; overflow-x: auto; }
  canvas { border: 1px solid #30363D; margin-top: 12px; image-rendering: pixelated; }
</style>
<h1>SPHEREx S3 HTTP Range Test (64x64)</h1>
<div>
  <input id="url" type="text" placeholder="https://nasa-irsa-spherex.s3.amazonaws.com/dr1/level2/..." />
  <button id="run">Probar Range</button>
</div>
<pre id="log">Listo. Pega una URL S3 de cloud_access y pulsa "Probar Range".</pre>
<canvas id="out" width="256" height="256"></canvas>

<script type="module">
const logEl = document.getElementById('log');
const canvas = document.getElementById('out');
const ctx = canvas.getContext('2d');

function log(msg) {
  logEl.textContent += '\n' + msg;
}

function parseFitsCards(buf, offset) {
  const dec = new TextDecoder('ascii');
  const cards = [];
  for (let i = offset; i + 80 <= buf.byteLength; i += 80) {
    cards.push(dec.decode(new Uint8Array(buf, i, 80)));
  }
  return cards;
}

function findHduLayout(buf) {
  let pos = 0;
  const hdus = [];
  while (pos + 2880 <= buf.byteLength) {
    const hStart = pos;
    let naxis = 0, bitpix = 0, dims = [], extname = 'PRIMARY', foundEnd = false;
    while (pos + 2880 <= buf.byteLength) {
      const cards = parseFitsCards(buf, pos);
      pos += 2880;
      for (const c of cards.slice(0, 36)) {
        if (c.startsWith('BITPIX  =')) bitpix = parseInt(c.slice(10, 30), 10);
        else if (c.startsWith('NAXIS   =')) naxis = parseInt(c.slice(10, 30), 10);
        else if (c.startsWith('NAXIS1  =')) dims[0] = parseInt(c.slice(10, 30), 10);
        else if (c.startsWith('NAXIS2  =')) dims[1] = parseInt(c.slice(10, 30), 10);
        else if (c.startsWith('NAXIS3  =')) dims[2] = parseInt(c.slice(10, 30), 10);
        else if (c.startsWith('EXTNAME =')) extname = c.split('=')[1].split('/')[0].replace(/[' ]/g, '');
        else if (c.startsWith('END     ')) { foundEnd = true; break; }
      }
      if (foundEnd) break;
    }
    if (!foundEnd) break;
    const elem = dims.reduce((a, b) => a * b, 1);
    const dataBytes = naxis > 0 ? elem * (Math.abs(bitpix) / 8) : 0;
    const padded = dataBytes > 0 ? Math.ceil(dataBytes / 2880) * 2880 : 0;
    hdus.push({ extname, headerStart: hStart, dataStart: pos, bitpix, dims, dataBytes });
    pos += padded;
  }
  return hdus;
}

async function fetchRange(url, start, end) {
  const res = await fetch(url, { headers: { Range: `bytes=${start}-${end}` } });
  const buf = await res.arrayBuffer();
  return { status: res.status, headers: res.headers, buf };
}

document.getElementById('run').addEventListener('click', async () => {
  const url = document.getElementById('url').value.trim();
  if (!url) return;
  logEl.textContent = `[${new Date().toISOString()}] Iniciando prueba: ${url}`;
  let totalBytes = 0;
  let requests = 0;
  const t0 = performance.now();

  try {
    const hdrRes = await fetchRange(url, 0, 23039);
    requests++;
    totalBytes += hdrRes.buf.byteLength;
    log(`Header HTTP ${hdrRes.status}, ACAO=${hdrRes.headers.get('access-control-allow-origin')}, bytes=${hdrRes.buf.byteLength}`);
    if (hdrRes.status !== 206 && hdrRes.status !== 200) {
      throw new Error(`HTTP inesperado: ${hdrRes.status}`);
    }

    const hdus = findHduLayout(hdrRes.buf);
    const img = hdus.find(h => h.extname === 'IMAGE') || hdus[1] || hdus[0];
    if (!img || !img.dims[0] || !img.dims[1]) {
      throw new Error('No se encontro cabecera IMAGE completa en los primeros 23,040 bytes.');
    }
    log(`HDU ${img.extname}: ${img.dims[0]}x${img.dims[1]}, BITPIX=${img.bitpix}, dataStart=${img.dataStart}`);

    const nx = img.dims[0], ny = img.dims[1];
    const bpp = Math.abs(img.bitpix) / 8;
    const y0 = Math.floor(ny / 2) - 32;
    const x0 = Math.floor(nx / 2) - 32;
    const slabStart = img.dataStart + y0 * nx * bpp;
    const slabEnd = slabStart + 64 * nx * bpp - 1;
    const slabRes = await fetchRange(url, slabStart, slabEnd);
    requests++;
    totalBytes += slabRes.buf.byteLength;
    const elapsed = (performance.now() - t0).toFixed(1);
    log(`Slab 64 filas HTTP ${slabRes.status}, bytes=${slabRes.buf.byteLength}`);
    log(`TOTAL: ${requests} peticiones, ${totalBytes} bytes (${(totalBytes / 1024).toFixed(1)} KB), ${elapsed} ms`);

    const view = new DataView(slabRes.buf);
    const vals = new Float32Array(64 * 64);
    let min = Infinity, max = -Infinity;
    for (let r = 0; r < 64; r++) {
      for (let c = 0; c < 64; c++) {
        const v = view.getFloat32((r * nx + (x0 + c)) * 4, false);
        vals[r * 64 + c] = v;
        if (Number.isFinite(v)) {
          if (v < min) min = v;
          if (v > max) max = v;
        }
      }
    }
    const imgData = ctx.createImageData(64, 64);
    const span = max > min ? max - min : 1;
    for (let i = 0; i < 64 * 64; i++) {
      const g = Number.isFinite(vals[i]) ? Math.max(0, Math.min(255, Math.round(((vals[i] - min) / span) * 255))) : 0;
      imgData.data[i * 4] = g;
      imgData.data[i * 4 + 1] = g;
      imgData.data[i * 4 + 2] = g;
      imgData.data[i * 4 + 3] = 255;
    }
    const off = document.createElement('canvas');
    off.width = 64; off.height = 64;
    off.getContext('2d').putImageData(imgData, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(off, 0, 0, 256, 256);
  } catch (err) {
    log(`ERROR: ${err.message}`);
  }
});
</script>
